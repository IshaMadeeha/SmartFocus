<!--
Create a modern Smart Study Assistant UI.

Requirements:
- Add fixed header with title "Smart Study Assistant"
- Create a centered container card
- Add:
    - Task input (id: taskInput)
    - Timer display (id: timer)
    - Start button (id: startButton)
    - Stop button (id: stopButton)
    - Study mode dropdown (id: modeSelect)
    - Suggestion text (id: suggestion)
    - Emotion display (id: emotionText)
    - Webcam video element (id: video)
- Ensure layout is clean and scrollable
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Smart Study Assistant</title> 
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 1em 0;
            z-index: 1000;
        }
        .container {
            margin-top: 80px; /* To avoid overlap with fixed header */
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 80px);
        }
        .card {
            background-color: white;
            padding: 2em;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .input-group {
            margin-bottom: 1em;
        }
        label {
            display: block;
            margin-bottom: 0.5em;
        }
        input, select, button {
            width: 100%;
            padding: 0.5em;
            margin-bottom: 1em;
        }
        #timer {
            font-size: 1.5em;
            text-align: center;
            margin-bottom: 1em;
        }
        #video {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Smart Study Assistant</h1>
    </header>
    <div class="container">
        <div class="card">
            <div class="input-group">
                <label for="taskInput">Task:</label>
                <input type="text" id="taskInput" placeholder="Enter your study task">
            </div>
            <div id="timer">00:00</div>
            <button id="startButton">Start</button>
            <button id="stopButton">Stop</button>   
            <div class="input-group">
                <label for="modeSelect">Study Mode:</label>
                <select id="modeSelect">
                    <option value="pomodoro">Pomodoro</option>
                    <option value="deep-focus">Deep Focus</option>
                    <option value="custom">Custom</option>
                </select>
            </div>
            <div id="suggestion">Suggestions will appear here...</div>
            <div id="emotionText">Your current emotion will be displayed here...</div>
            <video id="video" autoplay></video>
        </div>
    </div>
</body>
</html>  

<!-- link css and javascript files-->
<link rel="stylesheet" href="styles.css">
<script src="script.js"></script>
